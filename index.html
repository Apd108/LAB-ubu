<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual ECE Lab</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #121214;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="mobile-warning-modal" class="mobile-warning-overlay">
      <div class="mobile-warning-card">
        <h2 class="mobile-warning-title">Desktop or Laptop Required</h2>
        <p class="mobile-warning-body">This 3D Digital & Analog Electronics Lab Simulator is built for desktop and laptop screens with mouse or trackpad precision. Please open this link on a desktop or laptop computer.</p>
        <button id="mobile-warning-dismiss-btn" class="mobile-warning-btn" type="button">Continue anyway</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
